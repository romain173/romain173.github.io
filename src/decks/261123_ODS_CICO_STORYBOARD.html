<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f1f1f3;color:#17153b;font-family:'Funnel Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:56px 20px 120px}
header{margin:0 0 56px}
h1{margin:0;font-weight:300;font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-.5px;color:#0e479b}
header p{margin:14px 0 0;font-family:'Azeret Mono',ui-monospace,Menlo,monospace;font-weight:300;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#5d6a94}
figure{margin:0 0 64px}
figure img{display:block;width:100%;height:auto;border-radius:14px;background:#e3eaec;box-shadow:0 22px 34px -26px rgba(23,21,59,.35)}
figcaption{display:flex;gap:22px;align-items:baseline;margin:20px 4px 0}
.num{flex:none;width:34px;font-family:'Azeret Mono',ui-monospace,Menlo,monospace;font-weight:300;font-size:14px;letter-spacing:.6px;color:#4f7fd0}
.vo{margin:0;max-width:62ch;font-weight:300;font-size:clamp(19px,2.1vw,26px);line-height:1.35;color:#17153b}
.vo.sans{font-family:'Azeret Mono',ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#8d95b3}
@media (max-width:600px){main{padding:32px 16px 80px}figure{margin-bottom:44px}figcaption{gap:14px}figure img{border-radius:8px}}

<body><main>
<header><h1>Visit Qatar Experience<br>Storyboard</h1><p>19 boards · voice-over under each board · work in progress</p></header>
<figure id="p01"><img src="261123_ODS_CICO_STORYBOARD/p01.jpg" width="1920" height="1080" alt="Board 1" >
<figcaption><span class="num">01</span><p class="vo sans">No voice-over</p></figcaption></figure>
<figure id="p02"><img src="261123_ODS_CICO_STORYBOARD/p02.jpg" width="1920" height="1080" alt="Board 2" >
<figcaption><span class="num">02</span><p class="vo">You’ve mastered the art of building awareness. A social post, a text message, an email, a website banner…</p></figcaption></figure>
<figure id="p03"><img src="261123_ODS_CICO_STORYBOARD/p03.jpg" width="1920" height="1080" alt="Board 3" loading="lazy">
<figcaption><span class="num">03</span><p class="vo">…a QR code, a billboard, a stadium screen, an announcer’s read. The next opportunity is consideration.</p></figcaption></figure>
<figure id="p04"><img src="261123_ODS_CICO_STORYBOARD/p04.jpg" width="1920" height="1080" alt="Board 4" loading="lazy">
<figcaption><span class="num">04</span><p class="vo">What if each of those moments of attention became…</p></figcaption></figure>
<figure id="p05"><img src="261123_ODS_CICO_STORYBOARD/p05.jpg" width="1920" height="1080" alt="Board 5" loading="lazy">
<figcaption><span class="num">05</span><p class="vo">the start of a meaningful conversation?</p></figcaption></figure>
<figure id="p06"><img src="261123_ODS_CICO_STORYBOARD/p06.jpg" width="1920" height="1080" alt="Board 6" loading="lazy">
<figcaption><span class="num">06</span><p class="vo">One that understands what matters to each person, and guides them toward a decision.</p></figcaption></figure>
<figure id="p07"><img src="261123_ODS_CICO_STORYBOARD/p07.jpg" width="1920" height="1080" alt="Board 7" loading="lazy">
<figcaption><span class="num">07</span><p class="vo">One tap, and they’re in.</p></figcaption></figure>
<figure id="p08"><img src="261123_ODS_CICO_STORYBOARD/p08.jpg" width="1920" height="1080" alt="Board 8" loading="lazy">
<figcaption><span class="num">08</span><p class="vo">It’s web, so it lives wherever you put the link. No app, no download, no friction.</p></figcaption></figure>
<figure id="p09"><img src="261123_ODS_CICO_STORYBOARD/p09.jpg" width="1920" height="1080" alt="Board 9" loading="lazy">
<figcaption><span class="num">09</span><p class="vo">Consent comes first, in plain language: the experience listens when you speak.</p></figcaption></figure>
<figure id="p10"><img src="261123_ODS_CICO_STORYBOARD/p10.jpg" width="1920" height="1080" alt="Board 10" loading="lazy">
<figcaption><span class="num">10</span><p class="vo">Then the AI speaks first. Nothing is scripted: it adapts to the place, the moment, the person.</p></figcaption></figure>
<figure id="p11"><img src="261123_ODS_CICO_STORYBOARD/p11.jpg" width="1920" height="1080" alt="Board 11" loading="lazy">
<figcaption><span class="num">11</span><p class="vo">It asks what they’re looking for, and guides them to the right room. As many rooms as you want, for any audience.</p></figcaption></figure>
<figure id="p12"><img src="261123_ODS_CICO_STORYBOARD/p12.jpg" width="1920" height="1080" alt="Board 12" loading="lazy">
<figcaption><span class="num">12</span><p class="vo">Inside a room, topics take the conversation further. You choose the territories; the conversation stays free inside.</p></figcaption></figure>
<figure id="p13"><img src="261123_ODS_CICO_STORYBOARD/p13.jpg" width="1920" height="1080" alt="Board 13" loading="lazy">
<figcaption><span class="num">13</span><p class="vo">The intelligence is in the conversation: several AIs read the signals, shape the answer, and keep your brand’s voice.</p></figcaption></figure>
<figure id="p14"><img src="261123_ODS_CICO_STORYBOARD/p14.jpg" width="1920" height="1080" alt="Board 14" loading="lazy">
<figcaption><span class="num">14</span><p class="vo">You decide the actions. The AI decides the moment: when the signals say they’re ready, not before.</p></figcaption></figure>
<figure id="p15"><img src="261123_ODS_CICO_STORYBOARD/p15.jpg" width="1920" height="1080" alt="Board 15" loading="lazy">
<figcaption><span class="num">15</span><p class="vo">That was one conversation. Now multiply by ten thousand: what people really want, and what no focus group will tell you.</p></figcaption></figure>
<figure id="p16"><img src="261123_ODS_CICO_STORYBOARD/p16.jpg" width="1920" height="1080" alt="Board 16" loading="lazy">
<figcaption><span class="num">16</span><p class="vo">And it doesn’t just create conversations. It tells you what they mean.</p></figcaption></figure>
<figure id="p17"><img src="261123_ODS_CICO_STORYBOARD/p17.jpg" width="1920" height="1080" alt="Board 17" loading="lazy">
<figcaption><span class="num">17</span><p class="vo">No analyst required: who is ready, what holds them back, what people are really saying, and what to do next.</p></figcaption></figure>
<figure id="p18"><img src="261123_ODS_CICO_STORYBOARD/p18.jpg" width="1920" height="1080" alt="Board 18" loading="lazy">
<figcaption><span class="num">18</span><p class="vo">Welcome to your AI Experience Room.</p></figcaption></figure>
<figure id="p19"><img src="261123_ODS_CICO_STORYBOARD/p19.jpg" width="1920" height="1080" alt="Board 19" loading="lazy">
<figcaption><span class="num">19</span><p class="vo">The AI Experience Room. Turning attention into conversion.</p></figcaption></figure>
</main></body></html>
